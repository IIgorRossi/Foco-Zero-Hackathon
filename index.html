<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061b2a">
  <meta name="description" content="Foco Zero: prevenção comunitária à dengue em Nova Londrina.">
  <title>Foco Zero — Nova Londrina contra a dengue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#inicio" data-page="inicio" aria-label="Foco Zero, início"><img class="brand-logo" src="logofocozero.png?v=3" alt="Foco Zero — Nova Londrina contra a dengue"></a>
      <span class="nav-caption">MENU PRINCIPAL</span>
      <nav class="side-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-page="inicio"><span class="nav-icon"><i class="fa-solid fa-house" aria-hidden="true"></i></span> Início</button>
        <button class="nav-item" data-page="mapa"><span class="nav-icon"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span> Mapa de focos <span class="nav-count" id="nav-report-count">06</span></button>
        <button class="nav-item" data-page="relatar"><span class="nav-icon"><i class="fa-solid fa-plus" aria-hidden="true"></i></span> Novo relato</button>
        <button class="nav-item" data-page="missao"><span class="nav-icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span> Missão preventiva</button>

        <button class="nav-item" data-page="saude"><span class="nav-icon"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></span> Saúde e dengue</button>
      </nav>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb">Comunidade <span>/</span> <strong id="breadcrumb-current">Início</strong></div><div class="topbar-right"><span class="city-pill"><i class="fa-solid fa-location-dot" aria-hidden="true"></i> Nova Londrina, PR</span><button class="text-size-toggle" id="text-size-toggle" type="button" aria-label="Aumentar tamanho das letras" title="Aumentar tamanho das letras">A+</button><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema escuro" aria-pressed="false" title="Ativar tema escuro"><i class="fa-solid fa-moon" aria-hidden="true"></i><span>Escuro</span></button></div></header>
      <div class="content" id="content" tabindex="-1"></div>
      <footer class="footer">Foco Zero <span>·</span> Demonstração local <span class="footer-watermark">Desenvolvido por Igor Augusto Rossi</span><span class="footer-right">Dados fictícios</span></footer>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Navegação inferior">
    <button class="active" data-page="inicio"><span><i class="fa-solid fa-house" aria-hidden="true"></i></span>Início</button>
    <button data-page="mapa"><span><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span>Mapa</button>
    <button class="mobile-add" data-page="relatar" aria-label="Novo relato"><span><i class="fa-solid fa-plus" aria-hidden="true"></i></span><small>Relatar</small></button>
    <button data-page="missao"><span><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>Missão</button>
    <button data-page="saude"><span><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></span>Saúde</button>

  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
